name: Typelevel Flake Steward

on:
  schedule:
    - cron: '45 7 28 * *'
  workflow_dispatch:

jobs:
  lockfile:
    strategy:
      matrix:
        repo:
          - typelevel/case-insensitive
          - typelevel/cats-effect
          - typelevel/fs2
          - typelevel/kind-projector
          - typelevel/otel4s
          - typelevel/scalac-options
          - typelevel/scalacheck-xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-05-15

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 207424
          private-key: ${{ secrets.STEWARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update/flake-lock
          git-author-email: 106827141+typelevel-steward[bot]@users.noreply.github.com
          git-author-name: typelevel-steward[bot]
          git-committer-email: 106827141+typelevel-steward[bot]@users.noreply.github.com
          git-committer-name: typelevel-steward[bot]
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
